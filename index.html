<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #dbeafe;
        }

        h1 {
            text-align: center;
        }

        form {
            width: 100%;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid black;
            border-radius: 8px;
        }

        .campo {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 8px;
            background-color: white;
            font-size: 16px;
        }

        .campo:focus {
            background-color: lightblue;
        }

        fieldset {
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
        }

        button:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>

    <main>
        <h1>Formulário de Cadastro</h1>

        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" class="campo">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" class="campo">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" class="campo">

            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento" class="campo">

            <label for="curso">Curso</label>
            <select id="curso" name="curso" class="campo">
                <option>Engenharia de Software</option>
                <option>Ciência da Computação</option>
                <option>Sistemas de Informação</option>
            </select>

            <fieldset>
                <legend>Sexo</legend>
                <input type="radio" id="masculino" name="sexo" value="masculino">
                <label for="masculino">Masculino</label><br>
                <input type="radio" id="feminino" name="sexo" value="feminino">
                <label for="feminino">Feminino</label>
            </fieldset>

            <fieldset>
                <legend>Interesses</legend>
                <input type="checkbox" id="programacao" name="interesses" value="programacao">
                <label for="programacao">Programação</label><br>
                <input type="checkbox" id="jogos" name="interesses" value="jogos">
                <label for="jogos">Jogos</label><br>
                <input type="checkbox" id="esportes" name="interesses" value="esportes">
                <label for="esportes">Esportes</label>
            </fieldset>

            <label for="comentarios">Comentários</label>
            <textarea id="comentarios" name="comentarios" class="campo"></textarea>

            <label for="foto">Upload de foto</label>
            <input type="file" id="foto" name="foto" class="campo">

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </main>

</body>
</html>
